<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B2A6F"><link rel="apple-touch-icon" href="icon-192.png"><title>BMI · Banda Messias Instrumentos</title>
<style>
:root{--bg:#F4F8FF;--card:#fff;--ink:#0B1E4A;--mute:#5B6B8C;--line:#DCE6F7;--navy:#0B2A6F;--blue:#1E5EFF;--peach:#FFD2B3;--orange:#FF7A2F;--ok:#12805C;--okb:#DDF5EA;--bad:#C62F2F;--badb:#FDE3E1;--man:#B85A0A;--manb:#FFE9D6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1430;--card:#122046;--ink:#EAF0FF;--mute:#9CAED6;--line:#233765;--navy:#0A1B4D;--okb:#0F3B2D;--ok:#5FDDAE;--badb:#4A1D22;--bad:#FF8A8A;--manb:#4D2D14;--man:#FFB27A}}
:root[data-theme="dark"]{--bg:#0A1430;--card:#122046;--ink:#EAF0FF;--mute:#9CAED6;--line:#233765;--navy:#0A1B4D;--okb:#0F3B2D;--ok:#5FDDAE;--badb:#4A1D22;--bad:#FF8A8A;--manb:#4D2D14;--man:#FFB27A}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;padding-bottom:84px}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:16px 16px 22px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--peach),transparent 70%);opacity:.55}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brand b{font-size:26px;letter-spacing:3px;display:block;line-height:1}
.brand small{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.live{margin-left:auto;font-size:12px;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:99px;z-index:1}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CF5C0;margin-right:5px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -6px 20px rgba(11,42,111,.08)}
nav button{flex:1;border:0;background:none;color:var(--mute);font-size:11px;padding:6px 2px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{background:linear-gradient(135deg,var(--peach),#FFE6D1);color:#8A3A00;font-weight:700}
main{max-width:980px;margin:0 auto;padding:16px}
h2{margin:6px 0 12px;font-size:19px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.grid.k4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi b{font-size:30px;display:block}.kpi span{color:var(--mute);font-size:13px}
.kpi.t{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border:0}.kpi.t span{color:#cfe0ff}
.kpi.b b{color:var(--ok)}.kpi.d b{color:var(--bad)}.kpi.m b{color:var(--man)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.tag.bom{background:var(--okb);color:var(--ok)}.tag.danificado{background:var(--badb);color:var(--bad)}.tag.manutencao{background:var(--manb);color:var(--man)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;font-size:14px}
.btn.o{background:var(--orange)}.btn.g{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn.s{padding:6px 10px;font-size:12px;border-radius:10px}
.sb{background:var(--okb);color:var(--ok)}.sd{background:var(--badb);color:var(--bad)}.sm{background:var(--manb);color:var(--man)}
.btn.cur{outline:2px solid currentColor;opacity:.55;cursor:default}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
label{font-size:12px;color:var(--mute);display:block;margin:10px 0 4px}
.fl{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:12px}.fl input{grid-column:1/-1}
@media(min-width:700px){.fl{grid-template-columns:2fr 1fr 1fr 1fr}.fl input{grid-column:auto}}
.inst{margin-bottom:10px}.inst h3{margin:0 0 2px;font-size:16px}.inst p{margin:2px 0;color:var(--mute);font-size:13px}
.inst .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ev{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.ev:last-child{border:0}.ev small{color:var(--mute)}
.alert{border-left:5px solid var(--orange);background:linear-gradient(90deg,var(--manb),var(--card))}
.prov{margin-bottom:14px}.prov h3{margin:0 0 8px;color:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 8px 6px 12px;margin:0 6px 6px 0;font-size:14px}
.chip button{border:0;background:var(--manb);color:var(--man);border-radius:50%;width:22px;height:22px;cursor:pointer}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600}
#modal{position:fixed;inset:0;background:rgba(5,15,45,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}#mb{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#lg{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--blue));display:none;align-items:center;justify-content:center;z-index:100;padding:20px}#lg .bx{background:var(--card);border-radius:24px;padding:22px;width:100%;max-width:380px;max-height:90%;overflow:auto}#lg img{display:block;margin:0 auto 10px;border-radius:50%}
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--orange);color:#fff;padding:12px 14px;border-radius:14px;font-weight:700;z-index:60;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--mute);padding:24px}
@media print{nav,header .live,.noprint{display:none}}
</style>
</head>

const TIPOS=["Trompete","Trombone","Tuba","Saxofone","Clarinete","Flauta","Tambor","Caixa","Bombo","Pratos","Eufónio","Corneta","Bombardino","Lira"];
const LUANDA=["Viana","Cacuaco","Cazenga","Luanda","Kilamba Kiaxi","Sambizanga"];
const EST={bom:"Bom",danificado:"Danificado",manutencao:"Manutenção"};
const IC={transp:'<path d="M2 6h12v9H2zM14 9h4l3 3v3h-7z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6.5" cy="18" r="1.8" fill="currentColor"/><circle cx="17.5" cy="18" r="1.8" fill="currentColor"/>',painel:'<path d="M3 12l9-8 9 8v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/>',inst:'<path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zm11-2a3 3 0 1 1-3-3 3 3 0 0 1 3 3z" fill="none" stroke="currentColor" stroke-width="2"/>',polos:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/>',hist:'<path d="M12 7v5l3 2M4 12a8 8 0 1 0 3-6.2M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2"/>',bal:'<path d="M5 20V10m7 10V4m7 16v-7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>'};
const TABS=[["painel","Painel"],["inst","Stock"],["polos","Polos"],["transp","Transporte"],["hist","Histórico"],["bal","Balanço"]];
const S={polos:[],inst:[],hist:[],man:[],tr:[],as:null,tab:"painel",f:{q:"",prov:"",polo:"",est:""},mes:new Date().toISOString().slice(0,7),db:null,dl:null,t0:new Date().toISOString(),me:Math.random().toString(36).slice(2),ok:false,del:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fd=iso=>new Date(iso).toLocaleString("pt-PT",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const poloOf=id=>S.polos.find(p=>p.id===id);
const pn=id=>{const p=poloOf(id);return p?p.nome+" ("+p.prov+")":"Polo removido"};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",6000)}
function modal(h){$("#mb").innerHTML=h;$("#modal").classList.add("on")}
function closeM(){$("#modal").classList.remove("on")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM()});

function nav(){$("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${S.tab===k?"on":""}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg>${n}</button>`).join("")}
function go(t){S.tab=t;render();scrollTo(0,0)}
function render(){nav();const v=$("#v");
 if(!S.db){v.innerHTML='<div class="card empty">A ligar à base de dados partilhada… Abra esta página dentro do claude.ai com sessão iniciada para guardar e partilhar dados.</div>';return}
 ({painel:vPainelX,inst:vInst,polos:vPolos,hist:vHist,bal:vBal,transp:vTransp})[S.tab](v)}

function counts(list){return{t:list.length,b:list.filter(i=>i.estado==="bom").length,d:list.filter(i=>i.estado==="danificado").length,m:list.filter(i=>i.estado==="manutencao").length}}
function evHtml(e){const a=e.tipo==="saida"?`🚚 Saída <b>${esc(e.nome)}</b> → ${esc(e.destino||"")}`:e.tipo==="retorno"?`↩️ Regresso <b>${esc(e.nome)}</b>`:e.tipo==="novo"?`Novo instrumento <b>${esc(e.nome)}</b> registado`:`<b>${esc(e.nome)}</b>: ${EST[e.de]} → <span class="tag ${e.para}">${EST[e.para]}</span>`;return`<div class="ev">${a}<br><small>${esc(e.codigo)} · ${esc(e.polo)} · ${fd(e.ts)}</small></div>`}
function vPainel(v){const c=counts(S.inst),at=S.inst.filter(i=>i.estado!=="bom");
 v.innerHTML=`<div class="grid k4"><div class="card kpi t"><b>${c.t}</b><span>Total de instrumentos</span></div><div class="card kpi b"><b>${c.b}</b><span>Em bom estado</span></div><div class="card kpi d"><b>${c.d}</b><span>Danificados</span></div><div class="card kpi m"><b>${c.m}</b><span>Em manutenção</span></div></div>
 ${S.tr.filter(t=>t.estado==="saiu").length?`<div class="card" style="margin-top:12px">🚚 <b>${S.tr.filter(t=>t.estado==="saiu").length}</b> saída(s) em curso: ${S.tr.filter(t=>t.estado==="saiu").map(t=>esc(t.titulo)).join(", ")}</div>`:""}<h2 style="margin-top:20px">⚠️ Requer atenção (${at.length})</h2>
 ${at.length?at.map(i=>`<div class="card alert inst"><div class="top"><div><h3>${esc(i.nome)} <small>${esc(i.codigo)}</small></h3><p>${esc(pn(i.polo))} · ${esc(i.local||"sem local")}</p></div><span class="tag ${i.estado}">${EST[i.estado]}</span></div></div>`).join(""):'<div class="card empty">Tudo em ordem. Nenhum instrumento danificado ou em manutenção.</div>'}
 <h2 style="margin-top:20px">Últimas actualizações</h2><div class="card">${S.hist.slice(0,8).map(evHtml).join("")||'<div class="empty">Sem actividade ainda.</div>'}</div>`}

function vInst(v){const f=S.f;
 v.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Instrumentos</h2><button class="btn o" onclick="fInst()">+ Adicionar</button></div>
 ${penHtml()}<div class="fl"><input id="fq" placeholder="Procurar nome, código, série…" value="${esc(f.q)}"><select id="fp"><option value="">Todas as províncias</option>${[...new Set(S.polos.map(p=>p.prov))].sort().map(p=>`<option ${f.prov===p?"selected":""}>${esc(p)}</option>`).join("")}</select><select id="fl"><option value="">Todos os polos</option>${S.polos.filter(p=>!f.prov||p.prov===f.prov).map(p=>`<option value="${p.id}" ${f.polo===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}</select><select id="fe"><option value="">Todos os estados</option>${Object.entries(EST).map(([k,n])=>`<option value="${k}" ${f.est===k?"selected":""}>${n}</option>`).join("")}</select></div><div id="lista"></div>`;
 $("#fq").oninput=e=>{f.q=e.target.value;lista()};
 $("#fp").onchange=e=>{f.prov=e.target.value;f.polo="";vInst(v)};$("#fl").onchange=e=>{f.polo=e.target.value;lista()};$("#fe").onchange=e=>{f.est=e.target.value;lista()};lista()}
function lista(){const f=S.f,q=f.q.toLowerCase();
 const L=S.inst.filter(i=>(!f.polo||i.polo===f.polo)&&(!f.prov||poloOf(i.polo)?.prov===f.prov)&&(!f.est||i.estado===f.est)&&(!q||[i.nome,i.codigo,i.serie,i.marca,i.tipo,i.cor].join(" ").toLowerCase().includes(q)));
 $("#lista").innerHTML=L.length?L.map(i=>`<div class="card inst"><div class="top"><div><h3>${esc(i.nome)} <small style="color:var(--mute)">${esc(i.codigo)}</small></h3><p>${esc(i.tipo)}${i.marca?" · "+esc(i.marca):""}${i.cor?" · "+esc(i.cor):""}${i.serie?" · Série "+esc(i.serie):""}</p><p>📍 ${esc(pn(i.polo))} · ${esc(i.local||"sem local")}</p>${i.notas?`<p>📝 ${esc(i.notas)}</p>`:""}${extra(i)}</div><span class="tag ${i.estado}">${EST[i.estado]}</span></div>
 <div class="row" style="margin-top:10px">${[["bom","sb","Bom"],["danificado","sd","Danificado"],["manutencao","sm","Manutenção"]].map(([k,c,n])=>`<button class="btn s ${c} ${i.estado===k?"cur":""}" ${i.estado===k?"disabled":`onclick="setEst('${i.id}','${k}')"`}>${n}</button>`).join("")}${i.estado==="manutencao"?`<button class="btn s g" onclick="fManut('${i.id}','manutencao')">🔧 Custo/fatura</button>`:""}${S.admin?`<button class="btn s g" style="margin-left:auto" onclick="delI('${i.id}',this)">${S.del===i.id?"Confirmar?":"Apagar"}</button>`:""}</div></div>`).join(""):'<div class="card empty">Nenhum instrumento encontrado.</div>'}

function hist(i,de,para,tipo){const p=poloOf(i.polo);return S.db.collection("historico").doc(uid()).set({ts:new Date().toISOString(),instId:i.id,nome:i.nome,codigo:i.codigo,polo:p?p.nome:"?",poloId:i.polo,prov:p?p.prov:"",de,para,tipo,by:S.me})}
async function setEst(id,e){const i=S.inst.find(x=>x.id===id);if(!i||i.estado===e)return;if(e==="manutencao"||i.estado==="manutencao"){fManut(id,e);return}try{await stW(id,{estado:e,atualizado:new Date().toISOString()});await hist(i,i.estado,e,"estado")}catch(x){toast("Erro ao guardar: "+(x.message||x.code))}}
async function delI(id,b){if(!S.admin){toast("Só o administrador pode apagar instrumentos");return}if(S.del!==id){S.del=id;b.textContent="Confirmar?";setTimeout(()=>{S.del="";},4000);return}S.del="";try{await S.db.collection("instrumentos").doc(id).delete();try{await S.db.collection("estados").doc(id).delete()}catch(e){}}catch(x){toast("Erro: "+(x.message||x.code))}}
function fInst(){if(!S.polos.length){modal('<h2>Primeiro crie um polo</h2><p>Vá ao separador Polos e adicione pelo menos um polo.</p><button class="btn" onclick="closeM();go(\'polos\')">Ir para Polos</button>');return}
 modal(`<h2>Novo instrumento</h2><datalist id="dt">${TIPOS.map(t=>`<option value="${t}">`).join("")}</datalist>
 <label>Tipo *</label><input id="a_t" list="dt" placeholder="Ex.: Trompete"><label>Marca / modelo</label><input id="a_m"><label>Cor</label><input id="a_c" placeholder="Ex.: dourado, preto, prateado"><label>Nº de série</label><input id="a_s">
 <label>Polo *</label><select id="a_p">${S.polos.slice().sort((a,b)=>a.prov.localeCompare(b.prov)||a.nome.localeCompare(b.nome)).map(p=>`<option value="${p.id}">${esc(p.prov)} · ${esc(p.nome)}</option>`).join("")}</select>
 <label>Local de stock (sala, armário…)</label><input id="a_l"><label>Data de aquisição</label><input id="a_d" type="date"><label>Notas</label><textarea id="a_n" rows="2"></textarea>
 <div class="row" style="margin-top:14px"><button class="btn o" onclick="addI()">Guardar</button><button class="btn g" onclick="closeM()">Cancelar</button></div>`)}
async function addI(){const g=k=>$("#"+k).value.trim(),tipo=g("a_t");if(!tipo){toast("Indique o tipo de instrumento");return}
 const n=Math.max(0,...S.inst.map(i=>parseInt((i.codigo||"").replace(/\D/g,""))||0))+1,id=uid();
 const i={id,nome:tipo,tipo,marca:g("a_m"),cor:g("a_c"),serie:g("a_s"),polo:g("a_p"),local:g("a_l"),aquisicao:g("a_d"),notas:g("a_n"),estado:"bom",codigo:"BMI-"+String(n).padStart(4,"0"),criado:new Date().toISOString()};
 try{if(S.admin){await S.db.collection("instrumentos").doc(id).set(i);await hist(i,"bom","bom","novo")}else{await S.db.collection("pendentes").doc(id).set({...i,codigo:"",prop:new Date().toISOString(),by:S.me});toast("Enviado para aprovação do administrador")}closeM();S.tab="inst";render()}catch(x){toast("Erro: "+(x.message||x.code))}}

function vPolos(v){const by={};S.polos.forEach(p=>(by[p.prov]=by[p.prov]||[]).push(p));
 v.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Províncias e polos</h2><button class="btn o" onclick="fPolo()">+ Novo polo</button></div>
 ${Object.keys(by).sort().map(k=>`<div class="card prov"><h3>${esc(k)}</h3>${by[k].sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>{const c=counts(S.inst.filter(i=>i.polo===p.id));return`<span class="chip">${esc(p.nome)} <small style="color:var(--mute)">${c.t} inst.${c.d+c.m?` · ⚠️${c.d+c.m}`:""}</small><button title="Remover" onclick="delP('${p.id}')">×</button></span>`}).join("")}</div>`).join("")||`<div class="card empty">Ainda não há polos.<br><br><button class="btn" onclick="seedL()">Adicionar os 6 polos de Luanda</button></div>`}`}
function fPolo(){modal(`<h2>Novo polo</h2><datalist id="dp">${P.map(p=>`<option value="${p}">`).join("")}</datalist><label>Província *</label><input id="p_p" list="dp" placeholder="Ex.: Luanda"><label>Nome do polo *</label><input id="p_n" placeholder="Ex.: Viana"><div class="row" style="margin-top:14px"><button class="btn o" onclick="addP()">Guardar</button><button class="btn g" onclick="closeM()">Cancelar</button></div>`)}
async function addP(){const prov=$("#p_p").value.trim(),nome=$("#p_n").value.trim();if(!prov||!nome){toast("Preencha província e polo");return}
 if(S.polos.some(p=>p.prov===prov&&p.nome.toLowerCase()===nome.toLowerCase())){toast("Esse polo já existe");return}
 try{await S.db.collection("polos").doc(uid()).set({prov,nome});closeM()}catch(x){toast("Erro: "+(x.message||x.code))}}
async function seedL(){for(const n of LUANDA)await S.db.collection("polos").doc(uid()).set({prov:"Luanda",nome:n})}
function delP(id){const n=S.inst.filter(i=>i.polo===id).length;if(n){modal(`<h2>Não é possível remover</h2><p>Este polo tem ${n} instrumento(s). Apague-os primeiro.</p><button class="btn" onclick="closeM()">OK</button>`);return}
 modal(`<h2>Remover ${esc(poloOf(id).nome)}?</h2><div class="row"><button class="btn o" onclick="rmP('${id}')">Remover</button><button class="btn g" onclick="closeM()">Cancelar</button></div>`)}
async function rmP(id){try{await S.db.collection("polos").doc(id).delete();closeM()}catch(x){toast("Erro: "+(x.message||x.code))}}

const kz=n=>(+n||0).toLocaleString("pt-PT")+" Kz";
const loc=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fh=l=>(l||[]).length?`<div class="row" style="margin:6px 0">${l.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener"><img src="${esc(f.url)}" alt="fatura" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></a>`).join("")}</div>`:"";
function img(file,max,q){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>ok({b,u:c.toDataURL("image/jpeg",q)}),"image/jpeg",q)};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
async function up(file){if(S.as){const{b}=await img(file,1400,.8);const r=await S.as.upload(b);return{id:r.id,url:r.url}}const{u}=await img(file,700,.5);return{id:uid(),url:u}}
function extra(i){let h="";if(i.fora){const t=S.tr.find(x=>x.id===i.fora);h+=`<p>🚚 Em transporte${t?": "+esc(t.titulo)+" → "+esc(t.destino):""}</p>`}
 const m=S.man.find(x=>x.instId===i.id&&x.estado==="aberta");if(m&&i.estado==="manutencao")h+=`<p>🔧 ${esc(m.local)} · ${kz(m.custo)}</p>${fh(m.fotos)}`;return h}
function fManut(id,alvo){const i=S.inst.find(x=>x.id===id),m=S.man.find(x=>x.instId===id&&x.estado==="aberta"),fim=alvo!=="manutencao";
 modal(`<h2>${fim?"Concluir manutenção":"Manutenção"} · ${esc(i.nome)}</h2>${fim?`<p style="color:var(--mute);margin:0">O instrumento passa a <b>${EST[alvo]}</b>.</p>`:""}
 <label>Local da manutenção *</label><input id="m_l" value="${esc(m?.local||"")}" placeholder="Oficina, técnico, cidade…">
 <label>Descrição do problema / serviço</label><textarea id="m_d" rows="2">${esc(m?.descricao||"")}</textarea>
 <label>Custo (Kz)${fim?" *":""}</label><input id="m_c" type="number" inputmode="decimal" min="0" value="${m&&m.custo!=null?m.custo:""}">
 <label>Fotos da fatura / comprovativo de pagamento</label>${fh(m?.fotos)}<input id="m_f" type="file" accept="image/*" multiple>
 <div class="row" style="margin-top:14px"><button class="btn o" id="m_s" onclick="saveM('${id}','${alvo}')">${fim?"Concluir":"Guardar"}</button><button class="btn g" onclick="closeM()">Cancelar</button></div>`)}
async function saveM(id,alvo){const i=S.inst.find(x=>x.id===id),m=S.man.find(x=>x.instId===id&&x.estado==="aberta"),fim=alvo!=="manutencao",g=k=>$("#"+k).value.trim(),local=g("m_l"),cs=g("m_c");
 if(!local){toast("Indique o local da manutenção");return}
 if(fim&&cs===""){toast("Indique o custo (pode ser 0)");return}
 const b=$("#m_s");b.disabled=true;b.textContent="A guardar…";
 try{const fotos=[...(m?.fotos||[])];for(const f of $("#m_f").files)fotos.push(await up(f));
  const now=new Date().toISOString(),p=poloOf(i.polo),d={local,descricao:g("m_d"),custo:cs===""?0:+cs,fotos},mid=m?m.id:uid();
  if(m)await S.db.collection("manutencoes").doc(mid).update({...d,...(fim?{estado:"concluida",dataFim:now}:{})});
  else await S.db.collection("manutencoes").doc(mid).set({id:mid,instId:id,nome:i.nome,codigo:i.codigo,poloId:i.polo,polo:p?p.nome:"?",prov:p?p.prov:"",inicio:now,estado:fim?"concluida":"aberta",ts:now,...(fim?{dataFim:now}:{}),...d});
  if(i.estado!==alvo){await stW(id,{estado:alvo,atualizado:now});await hist(i,i.estado,alvo,"estado")}
  closeM()}catch(x){toast("Erro: "+(x.message||x.code||x));b.disabled=false;b.textContent="Guardar"}}

const TT=["Concerto","Actividade","Empréstimo","Outro"];
function delT(id){if(!S.admin)return;modal(`<h2>Apagar este registo de transporte?</h2><p style="color:var(--mute)">Só apaga o registo concluído. Esta acção não pode ser desfeita.</p>${btns("Apagar","doDelT('"+id+"')")}`)}
async function doDelT(id){const t=S.tr.find(x=>x.id===id);if(!S.admin||!t||t.estado==="saiu")return;try{await S.db.collection("transportes").doc(id).delete();closeM()}catch(x){toast("Erro: "+(x.message||x.code))}}
function vTransp(v){const em=S.tr.filter(t=>t.estado==="saiu"),fim=S.tr.filter(t=>t.estado!=="saiu");
 const card=t=>`<div class="card inst"><div class="top"><div><h3>${esc(t.titulo)} <small style="color:var(--mute)">${esc(t.tipo)}</small></h3><p>📍 ${esc(t.origemNome)} (${esc(t.prov)}) → ${esc(t.destino)}</p><p>Saída: ${fd(t.saida)}${t.prevRet?" · Previsto: "+esc(t.prevRet):""}${t.retorno?" · Regresso: "+fd(t.retorno):""}</p>${t.resp?`<p>Responsável: ${esc(t.resp)}</p>`:""}<p>🎺 ${t.inst.map(x=>esc(x.nome)+" "+esc(x.codigo)).join(", ")}</p>${t.obs?`<p>📝 ${esc(t.obs)}</p>`:""}${t.obsRet?`<p>↩️ ${esc(t.obsRet)}</p>`:""}</div><span class="tag ${t.estado==="saiu"?"manutencao":"bom"}">${t.estado==="saiu"?"Fora":"Devolvido"}</span></div>${t.estado==="saiu"?`<div class="row" style="margin-top:10px"><button class="btn s o" onclick="fRet('${t.id}')">Registar regresso</button></div>`:S.admin?`<div class="row" style="margin-top:10px"><button class="btn s g" onclick="delT('${t.id}')">Apagar registo</button></div>`:""}</div>`;
 v.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Transporte</h2><button class="btn o" onclick="fTransp()">+ Nova saída</button></div><h2 style="font-size:16px">Fora agora (${em.length})</h2>${em.map(card).join("")||'<div class="card empty">Nenhum instrumento fora.</div>'}<h2 style="font-size:16px;margin-top:18px">Concluídos</h2>${fim.map(card).join("")||'<div class="card empty">Sem registos.</div>'}`}
function fTransp(){if(!S.polos.length){toast("Crie primeiro um polo");return}
 modal(`<h2>Nova saída de instrumentos</h2><label>Concerto / actividade *</label><input id="t_t" placeholder="Ex.: Concerto de Natal"><label>Tipo</label><select id="t_k">${TT.map(x=>`<option>${x}</option>`).join("")}</select>
 <label>Sai de (polo) *</label><select id="t_p" onchange="clist()">${S.polos.slice().sort((a,b)=>a.prov.localeCompare(b.prov)||a.nome.localeCompare(b.nome)).map(p=>`<option value="${p.id}">${esc(p.prov)} · ${esc(p.nome)}</option>`).join("")}</select>
 <label>Vai para (local) *</label><input id="t_d" placeholder="Ex.: Igreja X, Benguela"><label>Data e hora de saída</label><input id="t_s" type="datetime-local" value="${loc()}"><label>Previsão de regresso</label><input id="t_r" type="date"><label>Responsável</label><input id="t_o">
 <label>Instrumentos (só em bom estado e disponíveis)</label><div id="t_l"></div><label>Observações</label><textarea id="t_n" rows="2"></textarea>

const gp=()=>{try{return localStorage.getItem("bmi_pin")}catch(e){return null}};
function setAdm(v){S.admin=v;$("#st").textContent=stTxt();closeM();render()}
function fPin(){if(!isLoc())return;const p=gp(),inp='<input id="pn" type="password" inputmode="numeric" placeholder="PIN">';
 modal(!p?`<h2>Definir PIN de administrador</h2><p style="color:var(--mute)">Escolha um PIN (mínimo 4 dígitos). Depois disso, o app abre em modo funcionário e só o PIN permite apagar e aprovar.</p>${inp}${btns("Guardar","setPin()")}`:S.admin?`<h2>Modo administrador</h2>${btns("Bloquear (modo funcionário)","setAdm(false)")}`:`<h2>Entrar como administrador</h2>${inp}${btns("Entrar","unlockA()")}`)}
async function setPin(){const v=$("#pn").value.trim();if(!/^\d{4,}$/.test(v)){toast("O PIN deve ter pelo menos 4 dígitos");return}try{localStorage.setItem("bmi_pin",await sha(v))}catch(e){toast("Não foi possível guardar o PIN");return}setAdm(true);toast("PIN definido")}
async function unlockA(){if(await sha($("#pn").value.trim())===gp())setAdm(true);else toast("PIN incorrecto")}
function vPainelX(v){vPainel(v);if(isLoc())v.insertAdjacentHTML("beforeend",`<h2 style="margin-top:20px">Dados offline</h2><div class="card"><p style="margin:0 0 10px;color:var(--mute);font-size:13px">Os dados estão neste aparelho. Cada polo exporta o seu ficheiro e envia ao administrador (WhatsApp, e-mail…), que importa e junta tudo. Registos apagados não se propagam.</p><div class="row"><button class="btn" onclick="expD()">Exportar dados</button>${S.admin?'<button class="btn g" onclick="$(\'#imp\').click()">Importar e juntar</button>':""}<input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="impD(this)"></div></div>`)}
function expD(){dlBlob(JSON.stringify(S.db.dump()),"BMI-dados-"+new Date().toISOString().slice(0,10)+".json","application/json")}
async function impD(el){const f=el.files[0];el.value="";if(!f||!S.admin)return;try{const n=S.db.merge(JSON.parse(await f.text()));toast("Importação concluída: "+n+" registo(s) novo(s) ou actualizado(s)")}catch(e){toast("Ficheiro inválido")}}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
boot();
</script>
</body>
</html>
